name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry for this version
        id: notes
        run: |
          python3 - <<'PY'
          import re, pathlib
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(
              r"## \[([^\]]+)\]\s*-\s*\d{4}-\d{2}-\d{2}(.*?)(?=\n## \[|\Z)",
              changelog, re.S)
          body = m.group(2).strip() if m else "See the changelog for details."
          pathlib.Path("RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sparrow v${{ steps.version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false